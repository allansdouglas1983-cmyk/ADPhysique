<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Training story · Volyume Community</title>
<meta name="description" content="A training story shared on Volyume Community.">
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="theme-color" content="#0D0D0D">
<meta name="robots" content="noindex, nofollow">
<!--
  SD-16 (blueprint §8, 40-DECISIONS.md). Story pages are noindex — the
  content is one person's training moment, not a page meant to rank.

  When the app is installed, the OS intercepts this URL via the verified
  app link (app.json autoVerify, host volyume.app, pathPrefix "/s") and
  this page never renders. It exists for someone who does not have the app
  yet: it renders ONLY the allow-listed fields community-public returns for
  kind=post (pr / session / block / milestone / programme) — never
  bodyweight, food or photos; the function does not return them.

  Query form only (?id=<uuid>): static GitHub Pages, no path rewriting,
  same fallback form the partner page already uses.
-->
<style>
  :root{
    --bg:#0D0D0D; --surface:#191917; --surface2:#232320; --border:#2E2E2C;
    --amber:#F5A623; --amberFill:#E08C0B; --amberBg:rgba(245,166,35,0.12);
    --text:#FFFFFF; --textSecondary:#9E9E9E;
    --good:#7FB069; --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html{color-scheme:dark;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:var(--font);
    -webkit-font-smoothing:antialiased; line-height:1.5;}
  .wrap{max-width:560px; margin:0 auto; padding:56px 24px 64px;}
  .brand{display:flex; align-items:center; gap:10px; margin-bottom:40px;}
  .brand img{height:36px; width:auto;}
  .author{display:flex; align-items:center; gap:10px; margin:0 0 20px;}
  .author .avatar{width:36px; height:36px; border-radius:50%; background:var(--amberBg); color:var(--amber);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; flex:0 0 auto;}
  .author .name b{color:var(--text); font-weight:700;}
  .author .name{color:var(--textSecondary); font-size:15px;}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:24px; margin:0 0 20px;}
  .eyebrow{font-size:13px; text-transform:uppercase; letter-spacing:0.06em; color:var(--textSecondary); margin:0 0 8px; font-weight:700;}
  .hero{font-weight:900; letter-spacing:-0.5px; font-size:clamp(28px,7vw,38px); line-height:1.1; margin:0 0 6px;}
  .sub{color:var(--textSecondary); font-size:16px; margin:0 0 4px;}
  .stat-row{display:flex; justify-content:space-between; padding:6px 0; font-size:15px; border-bottom:1px solid var(--border);}
  .stat-row:last-child{border-bottom:none;}
  .stat-row .k{color:var(--textSecondary);}
  .lift{display:flex; justify-content:space-between; font-size:15px; padding:4px 0;}
  .caption{color:var(--text); font-size:16px; margin:0 0 24px; white-space:pre-wrap;}
  .cta{display:block; text-align:center; background:var(--amberFill); color:#0D0D0D; font-weight:800;
    font-size:17px; padding:16px; border-radius:14px; margin:0 0 12px; text-decoration:none;}
  .cta.secondary{background:transparent; color:var(--text); border:1px solid var(--border); font-weight:600;}
  .muted{color:var(--textSecondary); font-size:14px; margin-top:24px;}
  a{color:var(--amber);}
  #loading, #notfound{padding:80px 0; text-align:center; color:var(--textSecondary); font-size:16px;}
  #content{display:none;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><img src="/volyume-wordmark.png" alt="Volyume"></div>

    <div id="loading">Loading story…</div>
    <div id="notfound" style="display:none;">This link has expired or is private.</div>

    <div id="content">
      <div class="author" id="authorRow" style="display:none;">
        <span class="avatar" id="authorAvatar"></span>
        <span class="name" id="authorName"></span>
      </div>
      <div class="card" id="card"></div>
      <p class="caption" id="caption" style="display:none;"></p>

      <a class="cta" id="open" href="#">Open in Volyume</a>
      <a class="cta secondary" id="store" href="https://play.google.com/store/apps/details?id=app.volyume">Get Volyume</a>
      <p class="muted">Shared on Volyume Community. See our <a href="/privacy/">privacy policy</a>.</p>
    </div>
  </div>

  <script>
    var SUPABASE_FUNCTIONS_ORIGIN = 'https://sujrylzzxcqxxfygptns.supabase.co/functions/v1';

    function initials(name) {
      var parts = String(name || '').trim().split(/\s+/).filter(Boolean);
      if (!parts.length) return '?';
      return (parts[0][0] + (parts[1] ? parts[1][0] : '')).toUpperCase();
    }

    function el(tag, cls, text) {
      var e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text != null) e.textContent = text;
      return e;
    }

    function statRow(k, v) {
      var row = el('div', 'stat-row');
      row.appendChild(el('span', 'k', k));
      row.appendChild(el('span', null, v));
      return row;
    }

    // Card renderers, one per story kind (blueprint §8): pr, session,
    // block, milestone, programme. Every field read here is on the
    // POST_PAYLOAD_KEYS allow-list (src/lib/community/posts.js) —
    // never bodyweight, food or photos; community-public does not return them.
    function renderCard(post) {
      var card = document.getElementById('card');
      var payload = post.payload || {};
      card.innerHTML = '';

      if (post.kind === 'pr') {
        card.appendChild(el('div', 'eyebrow', 'Personal record'));
        card.appendChild(el('div', 'hero', payload.exerciseName || ''));
        var units = payload.units || 'kg';
        card.appendChild(el('div', 'sub', (payload.weight != null ? (payload.weight + units) : '')
          + (payload.reps != null ? (' x ' + payload.reps) : '')));
        if (payload.previousBest != null) {
          card.appendChild(el('div', 'sub', 'Previous best: ' + payload.previousBest + units));
        }
      } else if (post.kind === 'session') {
        card.appendChild(el('div', 'eyebrow', 'Training session'));
        card.appendChild(el('div', 'hero', payload.sessionName || 'Session'));
        if (payload.workingSets != null) card.appendChild(statRow('Working sets', payload.workingSets));
        if (payload.duration != null) card.appendChild(statRow('Duration', payload.duration));
        if (payload.tonnage != null) card.appendChild(statRow('Tonnage', payload.tonnage + (payload.units || '')));
      } else if (post.kind === 'block') {
        card.appendChild(el('div', 'eyebrow', 'Block complete'));
        card.appendChild(el('div', 'hero', payload.planName || 'Training block'));
        if (payload.weeks != null) card.appendChild(statRow('Weeks', payload.weeks));
        if (payload.sessions != null) card.appendChild(statRow('Sessions', payload.sessions));
        (payload.lifts || []).forEach(function (lift) {
          var row = el('div', 'lift');
          row.appendChild(el('span', null, lift.exerciseName || ''));
          row.appendChild(el('span', null, (lift.deltaKg > 0 ? '+' : '') + lift.deltaKg + (lift.units || 'kg')));
          card.appendChild(row);
        });
      } else if (post.kind === 'milestone') {
        card.appendChild(el('div', 'eyebrow', payload.eyebrow || 'Milestone'));
        card.appendChild(el('div', 'hero', (payload.heroValue != null ? payload.heroValue : '') + (payload.heroUnit || '')));
        if (payload.title) card.appendChild(el('div', 'sub', payload.title));
      } else if (post.kind === 'programme') {
        card.appendChild(el('div', 'eyebrow', 'Shared programme'));
        var link = el('a', 'hero');
        link.style.display = 'block';
        link.style.textDecoration = 'none';
        link.style.color = 'inherit';
        link.href = '/p/?id=' + encodeURIComponent(payload.id || '');
        link.textContent = payload.title || 'Programme';
        card.appendChild(link);
        var chipsLine = [];
        if (payload.days_per_week != null) chipsLine.push(payload.days_per_week + ' days');
        if (payload.exercise_count != null) chipsLine.push(payload.exercise_count + ' exercises');
        if (chipsLine.length) card.appendChild(el('div', 'sub', chipsLine.join(' · ')));
      } else {
        card.appendChild(el('div', 'sub', 'This story is no longer available in a format this page can show.'));
      }
    }

    function render(post) {
      var author = post.author || {};
      if (author.handle || author.display_name) {
        document.getElementById('authorRow').style.display = 'flex';
        document.getElementById('authorAvatar').textContent = initials(author.display_name || author.handle);
        var nameEl = document.getElementById('authorName');
        nameEl.innerHTML = '';
        if (author.display_name) {
          var b = document.createElement('b');
          b.textContent = author.display_name;
          nameEl.appendChild(b);
          nameEl.appendChild(document.createTextNode(' '));
        }
        if (author.handle) nameEl.appendChild(document.createTextNode('@' + author.handle));
      }

      renderCard(post);

      if (post.caption) {
        var c = document.getElementById('caption');
        c.style.display = 'block';
        c.textContent = post.caption;
      }

      document.getElementById('loading').style.display = 'none';
      document.getElementById('content').style.display = 'block';
    }

    function showNotFound() {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('notfound').style.display = 'block';
    }

    (function () {
      var params = new URLSearchParams(location.search);
      var id = (params.get('id') || '').trim();

      document.getElementById('open').setAttribute('href', 'volyume://s?id=' + encodeURIComponent(id));

      if (/iPad|iPhone|iPod/i.test(navigator.userAgent)) {
        document.getElementById('store')
          .setAttribute('href', 'https://apps.apple.com/app/idREPLACE_WITH_APP_STORE_ID');
      }

      if (!id) { showNotFound(); return; }

      fetch(SUPABASE_FUNCTIONS_ORIGIN + '/community-public?kind=post&id=' + encodeURIComponent(id))
        .then(function (res) {
          if (!res.ok) throw new Error('not-found');
          return res.json();
        })
        .then(render)
        .catch(showNotFound);
    })();
  </script>
</body>
</html>
